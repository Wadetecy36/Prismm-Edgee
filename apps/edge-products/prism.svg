<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C97A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5E6B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8965A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3EBF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#E8C97A;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Outer triangle -->
  <polygon points="100,20 180,160 20,160" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
  
  <!-- Middle triangle (rotated) -->
  <polygon points="100,50 160,140 40,140" fill="none" stroke="url(#blueGradient)" stroke-width="2" opacity="0.8"/>
  
  <!-- Inner triangle -->
  <polygon points="100,80 140,130 60,130" fill="url(#goldGradient)" opacity="0.9"/>
  
  <!-- Central accent line (prism ray) -->
  <line x1="100" y1="20" x2="100" y2="140" stroke="#E8C97A" stroke-width="2" opacity="0.6"/>
  
  <!-- Decorative corner accents -->
  <circle cx="100" cy="100" r="15" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Optional: Add subtle shimmer effect with small circles at vertices -->
  <circle cx="100" cy="20" r="3" fill="#E8C97A" opacity="0.7"/>
  <circle cx="180" cy="160" r="3" fill="#E8C97A" opacity="0.7"/>
  <circle cx="20" cy="160" r="3" fill="#E8C97A" opacity="0.7"/>
</svg>